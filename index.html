<style>
  :root{
    --navy:#1F3864;
    --navy-deep:#152847;
    --amber:#E8830C;
    --amber-deep:#C56E06;
    --paper:#F6F5F2;
    --card:#FFFFFF;
    --line:#DEDBD3;
    --ink:#1B1B18;
    --ink-soft:#6B675F;
    --good:#1E7A3D;
    --good-bg:#E7F5EC;
    --bad:#B5391D;
    --bad-bg:#FBEAE5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:0 0 120px 0;}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:18px 20px 22px;
    border-radius:0 0 18px 18px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:160px;height:160px;border-radius:50%;
    background:radial-gradient(circle, rgba(232,131,12,0.22), transparent 70%);
  }
  .brandrow{display:flex; align-items:center; gap:12px; position:relative; z-index:1;}
  .brandrow img{height:30px; width:auto; filter:invert(1) brightness(2);}
  .brandrow .name{font-weight:800; font-size:15px; letter-spacing:0.02em;}
  .brandrow .tag{font-size:11px; color:#B9C6DE; margin-top:1px;}
  .apptitle{font-size:22px; font-weight:800; margin:16px 0 2px; position:relative; z-index:1;}
  .appsub{font-size:12.5px; color:#B9C6DE; position:relative; z-index:1;}

  /* ---------- Section shells ---------- */
  .section{padding:18px 16px 4px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 1px 2px rgba(20,20,10,0.04);
  }
  .card h3{margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:700;}

  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
  .field input, .field textarea{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:9px;
    font-size:15px; font-family:inherit; background:#FDFCFB; color:var(--ink);
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--navy);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* ---------- Area cards ---------- */
  .area-list{display:flex; flex-direction:column; gap:12px;}
  .area{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden;
  }
  .area-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; cursor:pointer; gap:10px;
  }
  .area-head .left{display:flex; align-items:center; gap:10px; min-width:0;}
  .area-num{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    background:var(--navy); color:#fff; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .area-head .titles{min-width:0;}
  .area-head .aname{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .area-head .atarget{font-size:12px; color:var(--ink-soft);}
  .badge{
    flex:0 0 auto; font-size:11px; font-weight:800; padding:4px 9px; border-radius:20px;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .badge.good{background:var(--good-bg); color:var(--good);}
  .badge.bad{background:var(--bad-bg); color:var(--bad);}
  .badge.pending{background:#F0EEE9; color:var(--ink-soft);}
  .chevron{transition:transform 0.2s; flex:0 0 auto; color:var(--ink-soft);}
  .area.open .chevron{transform:rotate(180deg);}

  .area-body{padding:0 14px 16px; display:none;}
  .area.open .area-body{display:block;}

  .lux-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:10px 0;}
  .lux-grid .field label{text-align:center;}
  .lux-grid input{text-align:center; font-weight:700; font-size:16px;}

  .photo-zone{
    margin:12px 0 10px; border:1.5px dashed var(--line); border-radius:12px;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    padding:18px; gap:8px; background:#FBFAF8; cursor:pointer; text-align:center;
    min-height:120px;
  }
  .photo-zone.has-photo{padding:0; border-style:solid; overflow:hidden; min-height:0;}
  .photo-zone img{width:100%; display:block; max-height:260px; object-fit:cover;}
  .photo-zone .hint{font-size:12.5px; color:var(--ink-soft);}
  .photo-zone .icon{font-size:22px;}
  .photo-actions{display:flex; gap:8px; margin-top:8px;}
  .photo-actions button{flex:1;}

  .btn{
    border:none; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .btn-amber{background:var(--amber); color:#fff;}
  .btn-amber:active{background:var(--amber-deep);}
  .btn-outline{background:#fff; border:1.5px solid var(--line); color:var(--ink);}
  .btn-ghost{background:transparent; color:var(--navy); font-weight:700;}
  .btn-danger-ghost{background:transparent; color:var(--bad); font-weight:700;}
  .btn-full{width:100%;}
  .btn-sm{padding:8px 12px; font-size:12.5px; border-radius:8px;}

  .compliance-row{display:flex; gap:8px; margin:10px 0;}
  .compliance-row button{
    flex:1; padding:10px; border-radius:9px; border:1.5px solid var(--line);
    background:#fff; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .compliance-row button.sel-good{background:var(--good-bg); border-color:var(--good); color:var(--good);}
  .compliance-row button.sel-bad{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}

  .area-footer{display:flex; justify-content:space-between; align-items:center; margin-top:6px;}

  .empty{
    text-align:center; padding:36px 18px; color:var(--ink-soft); font-size:14px;
  }
  .empty .icon{font-size:30px; display:block; margin-bottom:8px;}

  datalist{}

  /* ---------- Add area launcher ---------- */
  .add-launcher{
    display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:14px;
    border:1.5px dashed var(--navy); color:var(--navy); font-weight:700; font-size:14.5px;
    background:#EEF2F8; cursor:pointer; width:100%; margin-top:2px;
  }
  .add-launcher .plus{
    width:26px; height:26px; border-radius:50%; background:var(--navy); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto;
  }

  /* ---------- Reference schedule ---------- */
  details.ref{border:1px solid var(--line); border-radius:12px; background:#fff; margin-bottom:14px;}
  details.ref summary{
    padding:13px 14px; font-weight:700; font-size:13.5px; cursor:pointer; list-style:none;
    display:flex; justify-content:space-between; align-items:center; color:var(--navy);
  }
  details.ref summary::-webkit-details-marker{display:none;}
  .ref-table{padding:0 14px 14px;}
  .ref-row{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid #F0EEE9; font-size:12.5px;}
  .ref-row:last-child{border-bottom:none;}
  .ref-row .t{color:var(--ink-soft); text-align:right; flex:0 0 auto; white-space:nowrap; font-weight:700;}
  .ref-row .n{flex:1; min-width:0;}

  /* ---------- Bottom action bar ---------- */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:rgba(246,245,242,0.92); backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:10px; max-width:720px; margin:0 auto;
  }
  .bottombar .btn{flex:1; padding:11px 6px; font-size:13px;}

  /* ---------- Modal (photo source picker) ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(20,20,15,0.45); z-index:50; display:none;
    align-items:flex-end; justify-content:center;
  }
  .sheet-backdrop.show{display:flex;}
  .sheet{
    background:#fff; width:100%; max-width:720px; border-radius:18px 18px 0 0;
    padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .sheet .grabber{width:36px; height:4px; background:var(--line); border-radius:3px; margin:6px auto 14px;}
  .sheet > button{width:100%; text-align:left; padding:14px 6px; font-size:15px; font-weight:600; border:none; background:none; border-bottom:1px solid #F0EEE9; font-family:inherit;}
  .sheet > button:last-of-type{border-bottom:none;}
  .sheet .cancel{color:var(--bad); text-align:center; font-weight:700; margin-top:6px;}
  .sheet-title{font-weight:800; font-size:15px; padding:4px 6px 12px;}
  .reports-list{max-height:52vh; overflow-y:auto;}
  .report-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 6px; border-bottom:1px solid #F0EEE9;}
  .report-row:last-child{border-bottom:none;}
  .report-row .info{flex:1; min-width:0; cursor:pointer;}
  .report-row .rtitle{font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .report-row.active .rtitle{color:var(--navy);}
  .report-row .rcur{font-size:11px; font-weight:800; color:var(--navy);}
  .report-row .rmeta{font-size:12px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .report-row .rdel{flex:0 0 auto; width:auto; text-align:center; background:none; border:none; border-bottom:none; color:var(--bad); font-size:17px; padding:6px 4px; cursor:pointer;}

  .toast{
    position:fixed; bottom:76px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px;
    font-weight:600; z-index:60; opacity:0; transition:all 0.25s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Report / print view ---------- */
  #reportView{display:none;}
  .rp-page{background:#fff; padding:26px 24px; max-width:800px; margin:0 auto;}
  .rp-header{display:flex; align-items:center; gap:14px; border-bottom:2px solid var(--navy); padding-bottom:12px; margin-bottom:16px;}
  .rp-header img{height:34px;}
  .rp-header .co{font-weight:800; font-size:18px; color:var(--navy);}
  .rp-header .sub{font-size:11px; color:var(--ink-soft);}
  .rp-title{font-size:19px; font-weight:800; color:var(--navy); text-align:center; margin:6px 0 2px;}
  .rp-subtitle{font-size:12px; text-align:center; color:var(--ink-soft); margin-bottom:16px; font-style:italic;}
  table.rp-meta{width:100%; border-collapse:collapse; margin-bottom:20px; font-size:12.5px;}
  table.rp-meta td{border:1px solid var(--line); padding:7px 10px;}
  table.rp-meta td.k{background:#F2F2F2; font-weight:700; width:32%;}
  .rp-sectionhead{font-size:14px; font-weight:800; color:var(--navy); border-bottom:1.5px solid var(--navy); padding-bottom:4px; margin:22px 0 10px;}
  .rp-area{border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:14px; page-break-inside:avoid;}
  .rp-area .hd{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .rp-area .hd .nm{font-weight:800; font-size:14px;}
  table.rp-lux{width:100%; border-collapse:collapse; font-size:12px; margin-bottom:8px;}
  table.rp-lux th{background:var(--navy); color:#fff; padding:6px; text-align:center; font-size:11px;}
  table.rp-lux td{border:1px solid var(--line); padding:6px; text-align:center;}
  .rp-comments{font-size:12px; color:var(--ink); margin-bottom:8px;}
  .rp-comments b{color:var(--ink-soft);}
  .rp-photo{width:100%; max-height:320px; object-fit:cover; border-radius:6px; border:1px solid var(--line);}
  .rp-nophoto{padding:30px; text-align:center; color:#aaa; font-size:12px; background:#FAFAFA; border:1px dashed var(--line); border-radius:6px;}

  table.rp-std{width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:14px;}
  table.rp-std th{background:var(--navy); color:#fff; padding:6px 8px; text-align:left; font-size:11px;}
  table.rp-std td{border:1px solid var(--line); padding:6px 8px; vertical-align:top;}
  table.rp-std td.principal{background:#EEF2F8;}
  .rp-body-text{font-size:12px; line-height:1.5; margin-bottom:10px;}
  ul.rp-bullets{margin:0 0 14px; padding-left:18px; font-size:12px; line-height:1.6;}
  table.rp-schedule{width:100%; border-collapse:collapse; font-size:11px; margin-bottom:10px;}
  table.rp-schedule th{background:var(--navy); color:#fff; padding:5px 7px; text-align:left; font-size:10.5px;}
  table.rp-schedule td{border:1px solid var(--line); padding:5px 7px;}
  table.rp-schedule td.tgt{text-align:center; white-space:nowrap; font-weight:700;}
  table.rp-schedule tr:nth-child(even) td{background:#F7F6F3;}
  table.rp-summary{width:100%; border-collapse:collapse; font-size:12px; margin-bottom:14px;}
  table.rp-summary th{background:var(--navy); color:#fff; padding:7px; text-align:center; font-size:11px;}
  table.rp-summary td{border:1px solid var(--line); padding:7px; text-align:center;}
  table.rp-summary td.nm{text-align:left;}
  table.rp-signoff{width:100%; border-collapse:collapse; font-size:12px; margin-top:6px;}
  table.rp-signoff td{border:1px solid var(--line); padding:12px 10px; width:50%; vertical-align:top;}
  table.rp-signoff .lbl{font-weight:700; margin-bottom:24px; display:block;}
  .rp-note{font-size:11px; font-style:italic; color:var(--ink-soft); margin-bottom:12px;}

  @media print{
    body *{visibility:hidden;}
    #reportView, #reportView *{visibility:visible;}
    #reportView{display:block; position:absolute; left:0; top:0; width:100%;}
    .rp-page{padding:0; max-width:100%;}
  }

  @media (max-width:380px){
    .lux-grid{grid-template-columns:1fr 1fr 1fr;}
  }
</style>
</head>

  // ---------- photo storage (IndexedDB) ----------
  // Photos are kept out of localStorage (which has a very small quota on
  // mobile Safari) and stored here instead, keyed by area id. Areas only
  // carry a boolean `photo` flag; the actual image bytes live in this DB.
  var PHOTO_DB_NAME = 'br-lux-survey-photos';
  var PHOTO_STORE = 'photos';
  var photoDbPromise = null;
  function openPhotoDb(){
    if(photoDbPromise) return photoDbPromise;
    photoDbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open(PHOTO_DB_NAME, 1);
      req.onupgradeneeded = function(){
        req.result.createObjectStore(PHOTO_STORE);
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return photoDbPromise;
  }
  function photoPut(id, dataUrl){
    return openPhotoDb().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(PHOTO_STORE, 'readwrite');
        tx.objectStore(PHOTO_STORE).put(dataUrl, id);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function photoGet(id){
    return openPhotoDb().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(PHOTO_STORE, 'readonly');
        var req = tx.objectStore(PHOTO_STORE).get(id);
        req.onsuccess = function(){ resolve(req.result || null); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function photoDelete(id){
    return openPhotoDb().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(PHOTO_STORE, 'readwrite');
        tx.objectStore(PHOTO_STORE).delete(id);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  var REPORTS_KEY = 'br-lux-survey-reports';
  var LEGACY_KEY = 'lux-app-data';

  var reports = [];
  var activeReportId = null;

  function emptyMeta(){
    return {name:"",client:"",site:"",ref:"",date:"",surveyor:"",instrument:"Extech LT300 Digital Light Meter",recommendations:""};
  }

  function newReportRecord(){
    var now = Date.now();
    return { id: uid(), meta: emptyMeta(), areas: [], createdAt: now, updatedAt: now };
  }

  function loadReports(){
    try{
      var raw = localStorage.getItem(REPORTS_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        reports = parsed.reports || [];
        activeReportId = parsed.activeId || null;
      } else {
        var legacyRaw = localStorage.getItem(LEGACY_KEY);
        if(legacyRaw){
          var legacy = JSON.parse(legacyRaw);
          var rec = newReportRecord();
          if(legacy.meta) rec.meta = Object.assign(rec.meta, legacy.meta);
          if(legacy.areas) rec.areas = legacy.areas;
          reports = [rec];
          activeReportId = rec.id;
        }
      }
    }catch(e){ /* no saved data yet, or storage unavailable */ }

    if(reports.length === 0){
      var first = newReportRecord();
      reports = [first];
      activeReportId = first.id;
    }
    if(!reports.some(function(r){ return r.id === activeReportId; })){
      activeReportId = reports[0].id;
    }
    persistReports();
  }

  function getActiveReport(){
    return reports.find(function(r){ return r.id === activeReportId; });
  }

  function loadState(){
    loadReports();
    var rec = getActiveReport();
    state.meta = Object.assign(emptyMeta(), rec.meta);
    state.areas = rec.areas || [];
    hydrateMetaFields();
    renderAreas();
    migrateInlinePhotos(state.areas);
  }

  // Older saves (or an old version of the app) may still have the raw photo
  // data URL sitting directly on the area instead of in IndexedDB. Move it
  // out in the background so it stops eating into the localStorage quota.
  function migrateInlinePhotos(areas){
    var pending = areas.filter(function(a){
      return typeof a.photo === 'string' && a.photo.indexOf('data:') === 0;
    });
    if(pending.length === 0) return;
    Promise.all(pending.map(function(a){
      return photoPut(a.id, a.photo).then(function(){ a.photo = true; });
    })).then(function(){ saveState(); });
  }

  function persistReports(){
    try{
      localStorage.setItem(REPORTS_KEY, JSON.stringify({ reports: reports, activeId: activeReportId }));
    }catch(e){
      console.error('Save failed', e);
      toast('Save failed — device storage may be full');
    }
  }

  var saveTimer = null;
  function saveState(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      var rec = getActiveReport();
      if(rec){
        rec.meta = state.meta;
        rec.areas = state.areas;
        rec.updatedAt = Date.now();
      }
      persistReports();
    }, 250);
  }

  function switchToReport(id){
    var rec = reports.find(function(r){ return r.id === id; });
    if(!rec) return;
    activeReportId = rec.id;
    state.meta = Object.assign(emptyMeta(), rec.meta);
    state.areas = rec.areas || [];
    openAreaId = null;
    hydrateMetaFields();
    renderAreas();
    persistReports();
    migrateInlinePhotos(state.areas);
  }

  function reportTitle(rec){
    var m = rec.meta || {};
    if(m.name) return m.name;
    if(m.client && m.site) return m.client + ' — ' + m.site;
    if(m.client) return m.client;
    if(m.site) return m.site;
    return 'Untitled report';
  }

  function fmtDateTime(ts){
    if(!ts) return '';
    var d = new Date(ts);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function reportMetaLine(rec){
    var m = rec.meta || {};
    var bits = [];
    if(m.ref) bits.push('Ref ' + m.ref);
    if(m.date) bits.push(fmtDate(m.date));
    var n = (rec.areas||[]).length;
    bits.push(n + (n===1 ? ' area' : ' areas'));
    bits.push('Updated ' + fmtDateTime(rec.updatedAt));
    return bits.join(' · ');
  }

  function renderReportsList(){
    var listEl = document.getElementById('reportsList');
    var sorted = reports.slice().sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
    var html = '';
    sorted.forEach(function(rec){
      var isActive = rec.id === activeReportId;
      html += '<div class="report-row'+(isActive?' active':'')+'">';
      html += '  <div class="info" data-open="'+rec.id+'">';
      html += '    <div class="rtitle">'+escapeHtml(reportTitle(rec))+(isActive?' <span class="rcur">• Current</span>':'')+'</div>';
      html += '    <div class="rmeta">'+escapeHtml(reportMetaLine(rec))+'</div>';
      html += '  </div>';
      html += '  <button class="rdel" data-del="'+rec.id+'" aria-label="Delete report">🗑</button>';
      html += '</div>';
    });
    listEl.innerHTML = html;
    listEl.querySelectorAll('[data-open]').forEach(function(el){
      el.addEventListener('click', function(){
        switchToReport(this.getAttribute('data-open'));

      });

    listEl.querySelectorAll('[data-del]').forEach(function(el){
      el.addEventListener('click', function(e){
        e.stopPropagation();
        var id = this.getAttribute('data-del');
        if(!confirm('Delete this report? This cannot be undone.')) return;
        var wasActive = id === activeReportId;
        reports = reports.filter(function(r){ return r.id !== id; });
        if(reports.length === 0){
          reports = [newReportRecord()];
        }
        if(wasActive){
          switchToReport(reports[0].id);
        } else {
          persistReports();
        }
        renderReportsList();
        toast('Report deleted');
      });
    });
  }

  // ---------- import report(s) from JSON file ----------
  // `photoTasks` collects IndexedDB writes for any embedded photo data so
  // the caller can wait for them before switching into the imported report.
  // An area can carry its photo either as `photoData` (dedicated field) or
  // as a raw data: URL directly in `photo` -- both are moved into IndexedDB
  // and never touch localStorage.
  function normalizeImportedReport(rec, photoTasks){
    var out = newReportRecord();
    if(rec.meta) out.meta = Object.assign(emptyMeta(), rec.meta);
    if(Array.isArray(rec.areas)){
      out.areas = rec.areas.map(function(a){
        // Preserve the incoming id when the file provides one (e.g. a
        // photo pack references these ids to attach photos later) --
        // only generate a fresh one if the area didn't already have it.
        var newId = (typeof a.id === 'string' && a.id) ? a.id : uid();
        var merged = Object.assign({ name:"", fittingType:"", condition:"", target:"", max:"", min:"", avg:"", compliant:null, comments:"", photo:null }, a, { id: newId });
        var dataUrl = null;
        if(typeof merged.photoData === 'string' && merged.photoData.indexOf('data:') === 0) dataUrl = merged.photoData;
        else if(typeof merged.photo === 'string' && merged.photo.indexOf('data:') === 0) dataUrl = merged.photo;
        delete merged.photoData;
        if(dataUrl){
          photoTasks.push(photoPut(newId, dataUrl));
          merged.photo = true;
        } else {
          merged.photo = null;
        }
        return merged;
      });
    }
    if(rec.createdAt) out.createdAt = rec.createdAt;
    out.updatedAt = Date.now();
    return out;
  }

  document.getElementById('importReportBtn').addEventListener('click', function(){
    document.getElementById('importInput').click();
  });
  document.getElementById('importInput').addEventListener('change', function(){
    var file = this.files[0];
    this.value = '';
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var parsed;
      try{
        parsed = JSON.parse(ev.target.result);
      }catch(e){
        toast('That file is not valid JSON');
        return;
      }

      // A "photo pack" attaches photos to areas that already exist (by id)
      // in an already-imported report, rather than importing a report of
      // its own. Used to split a large photo-heavy import into smaller
      // files that stay under the file-transfer size limit.
      if(parsed && parsed.photoPack === true && Array.isArray(parsed.photos)){
        var tasks = [];
        var matched = 0, missed = 0;
        parsed.photos.forEach(function(p){
          if(!p || !p.areaId || !p.photoData) return;
          var found = null;
          reports.forEach(function(r){
            (r.areas||[]).forEach(function(a){ if(a.id === p.areaId) found = a; });
          });
          if(!found){ missed++; return; }
          matched++;
          tasks.push(photoPut(p.areaId, p.photoData).then(function(){ found.photo = true; }));
        });
        if(matched === 0){
          toast('No matching areas found — import the report first');
          return;
        }
        toast('Attaching ' + matched + ' photos…');
        Promise.all(tasks).then(function(){
          persistReports();
          renderAreas();
          renderReportsList();
          closeReportsSheet();
          toast('Attached ' + matched + ' photos' + (missed ? ' (' + missed + ' not matched)' : ''));
        });
        return;
      }

      var incoming = Array.isArray(parsed.reports) ? parsed.reports : [parsed];
      var imported = [];
      var photoTasks = [];
      incoming.forEach(function(rec){
        if(!rec || typeof rec !== 'object') return;
        var out = normalizeImportedReport(rec, photoTasks);
        reports.push(out);
        imported.push(out);
      });
      if(imported.length === 0){
        toast('No report data found in that file');
        return;
      }
      if(photoTasks.length) toast('Importing ' + photoTasks.length + ' photos…');
      Promise.all(photoTasks).then(function(){
        switchToReport(imported[0].id);
        renderReportsList();
        closeReportsSheet();
        toast(imported.length === 1 ? 'Imported "' + reportTitle(imported[0]) + '"' : 'Imported ' + imported.length + ' reports');
      }).catch(function(e){
        console.error('Photo import failed', e);
        switchToReport(imported[0].id);
        renderReportsList();
        closeReportsSheet();
        toast('Imported, but some photos failed to save');
      });
    };
    reader.readAsText(file);
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function targetMin(targetStr){
    if(!targetStr) return null;
    var m = targetStr.replace(/,/g,'').match(/(\d+(\.\d+)?)/);
    return m ? parseFloat(m[1]) : null;
  }

  // ---------- areas ----------
  function addArea(){
    var a = { id: uid(), name:"", fittingType:"", condition:"", target:"", max:"", min:"", avg:"", compliant:null, comments:"", photo:null };
    state.areas.push(a);
    openAreaId = a.id;
    saveState();
    renderAreas();

    state.areas = state.areas.filter(function(a){ return a.id !== id; });
    saveState();
    renderAreas();
  }

  function updateArea(id, field, value){
    var a = state.areas.find(function(x){ return x.id===id; });
    if(!a) return;
    a[field] = value;
    saveState();

  function hydratePhotoImages(){
    document.querySelectorAll('img[data-photoid]').forEach(function(img){
      var id = img.getAttribute('data-photoid');
      var a = state.areas.find(function(x){ return x.id === id; });
      if(a && typeof a.photo === 'string'){ img.src = a.photo; return; }
      photoGet(id).then(function(dataUrl){ if(dataUrl) img.src = dataUrl; });
    });
  }

  function bindAreaEvents(){
    document.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = this.getAttribute('data-toggle');
        openAreaId = (openAreaId === id) ? null : id;
        renderAreas();
      });
    });
    document.querySelectorAll('.area-body input[data-field], .area-body textarea[data-field]').forEach(function(el){
      el.addEventListener('input', function(){
        updateArea(this.getAttribute('data-id'), this.getAttribute('data-field'), this.value);
        // live-update header labels without full rerender (avoid losing focus)
        var card = this.closest('.area');
        if(this.getAttribute('data-field')==='name'){
          card.querySelector('.aname').textContent = this.value || 'Untitled area';
          // auto-fill target if it matches a known preset and target is still empty
          var id = this.getAttribute('data-id');
          var a = state.areas.find(function(x){return x.id===id;});
          var match = PRESETS.find(function(p){ return p[0].toLowerCase() === this.value.toLowerCase(); }, this);
          if(match && a && !a.target){
            a.target = match[1];
            saveState();
            var tgtInput = card.querySelector('.a-target');
            if(tgtInput) tgtInput.value = match[1];
            card.querySelector('.atarget').textContent = match[1];
          }
        }
        if(this.getAttribute('data-field')==='target'){
          card.querySelector('.atarget').textContent = this.value || 'No target set';
        }
      });
    });
    document.querySelectorAll('[data-comp]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = this.getAttribute('data-id');
        var val = this.getAttribute('data-comp');
        var a = state.areas.find(function(x){return x.id===id;});
        a.compliant = (a.compliant === val) ? null : val;

        renderAreas();
        openAreaId = id;

    });

  function handlePhotoFile(file){
    if(!file || !activePhotoAreaId) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var maxW = 1000;
        var scale = Math.min(1, maxW/img.width);
        var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.72);
        var a = state.areas.find(function(x){return x.id===activePhotoAreaId;});
        if(a){
          photoPut(a.id, dataUrl).then(function(){
            a.photo = true;
            saveState();
            openAreaId = a.id;
            renderAreas();
            toast('Photo attached');
          });
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- generate report ----------
  document.getElementById('generateBtn').addEventListener('click', function(){
    if(state.areas.length === 0){
      toast('Add at least one area first');
      return;
    }
    buildReport().then(function(){
      window.onafterprint = function(){
        document.getElementById('reportView').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.querySelector('.bottombar').style.display = 'flex';
      };
      document.getElementById('mainApp').style.display = 'none';
      document.querySelector('.bottombar').style.display = 'none';
      document.getElementById('reportView').style.display = 'block';
      setTimeout(function(){ window.print(); }, 200);
    });
  });

  function fmtDate(d){
    if(!d) return '[Not set]';
    var parts = d.split('-');
    if(parts.length!==3) return d;
    return parts[2]+'/'+parts[1]+'/'+parts[0];
  }

  function buildReport(){
    var photoMap = {};
    return Promise.all(state.areas.map(function(a){
      if(!a.photo) return null;
      if(typeof a.photo === 'string'){ photoMap[a.id] = a.photo; return null; }
      return photoGet(a.id).then(function(dataUrl){ if(dataUrl) photoMap[a.id] = dataUrl; });
    })).then(function(){
      renderReportHtml(photoMap);
    });
  }

  function renderReportHtml(photoMap){
    var m = state.meta;
    var html = '';
    html += '<div class="rp-header"><img src="'+LOGO+'"><div><div class="co">B&amp;R ELECTRICAL</div><div class="sub">ABN 35 669 511 504 · REC 32656 · info@bandrelectrical.com.au</div></div></div>';
    html += '<div class="rp-title">Comprehensive Lighting (Lux) Assessment Report</div>';
    html += '<div class="rp-subtitle">Prepared in accordance with AS/NZS 1680 Interior and Workplace Lighting series</div>';

    html += '<table class="rp-meta">';
    html += trMeta('Client / Company', m.client);
    html += trMeta('Site Address', m.site);
    html += trMeta('Report Reference', m.ref);
    html += trMeta('Date of Inspection', fmtDate(m.date));
    html += trMeta('Surveyor', m.surveyor);
    html += trMeta('Instrument Used', m.instrument);
    html += '</table>';

    // 1. Standards & Guidelines
    html += '<div class="rp-sectionhead">1. Applicable Standards &amp; Guidelines</div>';
    html += '<div class="rp-body-text">This assessment has been conducted to verify that illuminance levels throughout the facility are adequate for the safe and effective performance of the tasks undertaken, and to support the client\'s food safety and workplace health and safety obligations. The following Standards and guidance documents form the basis of this report:</div>';
    html += '<table class="rp-std"><tr><th style="width:22%">Standard</th><th>Scope / Application</th></tr>';
    html += '<tr class="principal"><td class="principal"><b>AS/NZS 1680.2.4:2017</b></td><td class="principal"><b>PRINCIPAL STANDARD</b> — Interior and workplace lighting: Industrial tasks and processes. Sets maintained illuminance recommendations based on task difficulty for factory, processing and production environments.</td></tr>';
    html += '<tr><td>AS/NZS 1680.1</td><td>General principles, measurement methodology, uniformity ratios and glare limits. Read in conjunction with all other parts of the 1680 series.</td></tr>';
    html += '<tr><td>AS/NZS 1680.2.1</td><td>Corridors, amenities, stairs, toilets, change rooms and general circulation areas.</td></tr>';
    html += '<tr><td>AS/NZS 1680.2.2</td><td>Offices, screen-based work and administrative areas.</td></tr>';
    html += '<tr><td>AS/NZS 2293.1</td><td>Emergency lighting and exit signage — tested/commented on separately where applicable.</td></tr>';
    html += '</table>';
    html += '<div class="rp-body-text"><b>Food Standards Code note:</b> The Food Standards Code does not prescribe a single numerical lux value for every food-handling area. It requires lighting sufficient for employees to safely and effectively perform food-handling, cleaning and inspection activities. Accordingly, this report applies task-based targets from AS/NZS 1680.2.4:2017, informed by the practical schedule below, as the working benchmark for each area assessed.</div>';

    // 2. Methodology
    html += '<div class="rp-sectionhead">2. Methodology &amp; Instrumentation</div>';
    html += '<ul class="rp-bullets">';
    html += '<li>Readings taken with a calibrated Extech LT300 digital light meter, held at the relevant task/working plane height for each area.</li>';
    html += '<li>Where practical, readings were taken on a grid pattern across each area to capture Maximum, Minimum and Average illuminance.</li>';
    html += '<li>Readings were taken during normal/representative lighting conditions for the facility.</li>';
    html += '<li>Maintained illuminance is reported — i.e. the illuminance expected under normal in-service conditions, not a freshly-commissioned worst/best case.</li>';
    html += '<li>Uniformity was assessed qualitatively against AS/NZS 1680.1 principles (minimum should generally not fall below ~0.7 of the average within a task area).</li>';
    html += '</ul>';

    // 3. Reference schedule
    html += '<div class="rp-sectionhead">3. Lux Level Reference Schedule — Food Manufacturing Facility</div>';
    html += '<table class="rp-schedule"><tr><th>Factory Area or Task</th><th style="width:22%">Maintained Illuminance Target</th></tr>';
    PRESETS.forEach(function(p){
      html += '<tr><td>'+escapeHtml(p[0])+'</td><td class="tgt">'+escapeHtml(p[1])+'</td></tr>';
    });
    html += '</table>';
    html += '<div class="rp-note">Note: these are maintained values — lighting should still achieve these levels after allowing for LED depreciation, dirt, grease and general ageing of the installation. The task being performed determines the requirement, not simply the room name.</div>';

    // 4. Survey Results
    html += '<div class="rp-sectionhead">4. Survey Results</div>';
    state.areas.forEach(function(a, idx){
      html += '<div class="rp-area">';
      html += '<div class="hd"><span class="nm">'+(idx+1)+'. '+ (escapeHtml(a.name)||'Untitled area') +'</span><span>'+ complianceLabel(a.compliant) +'</span></div>';
      if(a.fittingType || a.condition){
        html += '<div class="rp-comments"><b>Luminaire type: </b>'+(escapeHtml(a.fittingType)||'—')+' &nbsp; <b>Condition: </b>'+(escapeHtml(a.condition)||'—')+'</div>';
      }
      html += '<table class="rp-lux"><tr><th>Target</th><th>Max</th><th>Min</th><th>Avg</th></tr>';
      html += '<tr><td>'+(escapeHtml(a.target)||'—')+'</td><td>'+(escapeHtml(a.max)||'—')+'</td><td>'+(escapeHtml(a.min)||'—')+'</td><td>'+(escapeHtml(a.avg)||'—')+'</td></tr></table>';
      if(a.comments){
        html += '<div class="rp-comments"><b>Comments: </b>'+escapeHtml(a.comments)+'</div>';
      }
      if(photoMap[a.id]){
        html += '<img class="rp-photo" src="'+photoMap[a.id]+'">';
      } else {
        html += '<div class="rp-nophoto">No photo attached</div>';
      }
      html += '</div>';
    });

    // 5. Summary
    html += '<div class="rp-sectionhead">5. Summary of Findings</div>';
    html += '<table class="rp-summary"><tr><th>Area / Task</th><th>Target (lux)</th><th>Avg Result (lux)</th><th>Compliant</th></tr>';
    state.areas.forEach(function(a){
      var mark = a.compliant==='good' ? '✓' : (a.compliant==='bad' ? '✕' : '—');
      html += '<tr><td class="nm">'+(escapeHtml(a.name)||'Untitled area')+'</td><td>'+(escapeHtml(a.target)||'—')+'</td><td>'+(escapeHtml(a.avg)||'—')+'</td><td>'+mark+'</td></tr>';
    });
    html += '</table>';

    // 6. Recommendations
    html += '<div class="rp-sectionhead">6. Recommendations</div>';
    html += '<div class="rp-body-text">'+ (m.recommendations ? escapeHtml(m.recommendations) : '[No recommendations recorded]') +'</div>';

    // 7. Sign-off
    html += '<div class="rp-sectionhead">7. Report Sign-Off</div>';
    html += '<table class="rp-signoff"><tr>';
    html += '<td><span class="lbl">Surveyed by:</span>Name: '+(escapeHtml(m.surveyor)||'[Insert]')+'<br>Position: [Insert]<br><br>Signature: ______________________<br><br>Date: '+fmtDate(m.date)+'</td>';
    html += '<td><span class="lbl">Reviewed by:</span>Name: [Insert]<br>Position: [Insert]<br><br>Signature: ______________________<br><br>Date: [Insert]</td>';
    html += '</tr></table>';

    document.getElementById('rpPage').innerHTML = html;
  }

  function trMeta(k,v){
    return '<tr><td class="k">'+k+'</td><td>'+ (v ? escapeHtml(v) : '[Not set]') +'</td></tr>';
  }
  function complianceLabel(c){
    if(c==='good') return '<span style="color:#1E7A3D;font-weight:800;font-size:11px;">✓ MEETS TARGET</span>';
    if(c==='bad') return '<span style="color:#B5391D;font-weight:800;font-size:11px;">✕ BELOW TARGET</span>';
    return '<span style="color:#999;font-weight:800;font-size:11px;">NOT ASSESSED</span>';
  }

  // datalist for area presets
  var dl = document.createElement('datalist');
  dl.id = 'presetList';
  PRESETS.forEach(function(p){
    var opt = document.createElement('option');
    opt.value = p[0];
    dl.appendChild(opt);
  });
  document.body.appendChild(dl);

  // datalist for luminaire type
  var dlType = document.createElement('datalist');
  dlType.id = 'luminaireTypeList';
  LUMINAIRE_TYPES.forEach(function(t){
    var opt = document.createElement('option');
    opt.value = t;
    dlType.appendChild(opt);
  });
  document.body.appendChild(dlType);

  // datalist for condition
  var dlCondition = document.createElement('datalist');
  dlCondition.id = 'conditionList';
  CONDITION_OPTIONS.forEach(function(c){
    var opt = document.createElement('option');
    opt.value = c;
    dlCondition.appendChild(opt);
  });
  document.body.appendChild(dlCondition);

  renderRefTable();
  loadState();
})();
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.log('Service worker registration failed:', err);
      });
    });
  }
</script>
</body>
